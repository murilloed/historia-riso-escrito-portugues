name: Compilar artigo
on:
  push:
    paths: ['artigo/**', 'scripts/build_data.py', 'scripts/build_appendices.py', 'scripts/build_method_inventory.py', 'scripts/audit_inventory.py', 'scripts/validate.py', 'scripts/analyze_forms.py', 'scripts/validate_analysis.py', 'requirements-analysis.txt', 'scripts/revision2_audit.py', 'data/**', '.github/workflows/latex.yml']
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar tabelas
        run: python scripts/build_appendices.py
      - name: Instalar bibliotecas de análise
        run: python -m pip install -r requirements-analysis.txt
      - name: Reproduzir gráficos e agrupamentos
        run: python scripts/analyze_forms.py
      - name: Validar análise exploratória
        run: python scripts/validate_analysis.py
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: artigo
      - uses: actions/upload-artifact@v4
        with:
          name: artigo-pdf
          path: artigo/main.pdf
